
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week 2 API</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
      background: #f4f7fb;
    }

    main {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #1769aa;
    }

    code {
      background: #edf2f7;
      padding: 3px 6px;
      border-radius: 4px;
    }
  </style>

<body>
  <main>
    <h1>My Week 2 API!</h1>

    <p>Welcome to my Express.js API project.</p>

    <h2>Available endpoints</h2>

    <ul>
      <li><code>GET /</code> — View this homepage.</li>
      <li><code>POST /user</code> — Submit a name and email.</li>
      <li><code>GET /user/:id</code> — View a user profile message.</li>
    </ul>

    <p>Built with Node.js and Express.</p>
  </main>

</html>
